<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎯 FocusHub</h1>
        <button id="themeBtn">🌙</button>
    </header>

    <main>
        <h2>Good morning! 👋</h2>
        <p>Ready to focus?</p>

        <section class="cards">
            <div class="card">
                <h3>📚 Subjects</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>✅ Tasks</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>⏱️ Focus Time</h3>
                <p>0 min</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
